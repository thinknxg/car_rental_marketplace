<script>
(function(){
  var p = window.location.pathname;
  var links = document.querySelectorAll('.mk-sidebar-link');
  var best = null;
  links.forEach(function(a){
    if(p.indexOf(a.dataset.path) === 0){
      if(!best || a.dataset.path.length > best.dataset.path.length) best = a;
    }
  });
  if(best) best.classList.add('active');
})();
</script>
