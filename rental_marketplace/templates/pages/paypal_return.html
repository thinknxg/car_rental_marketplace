{% extends "templates/web.html" %}
{% block title %}Payment{% endblock %}
{% block page_content %}
<link rel="stylesheet" href="/assets/rental_marketplace/css/marketplace.css?v=202611183">
{% include "rental_marketplace/templates/includes/site_nav.html" %}
<div class="mk-wrap" style="max-width:640px;padding:80px 20px;text-align:center">
  {% if success %}
    <div style="font-size:3rem;margin-bottom:16px">✅</div>
    <h1 class="mk-h1" style="margin-bottom:10px">{{ message }}</h1>
    <a class="mk-btn" style="display:inline-block;margin-top:20px;padding:14px 30px" href="/account/bookings">View my bookings</a>
  {% else %}
    <div style="font-size:3rem;margin-bottom:16px">⚠️</div>
    <h1 class="mk-h1" style="margin-bottom:10px">{{ message }}</h1>
    <a class="mk-btn" style="display:inline-block;margin-top:20px;padding:14px 30px" href="/fleet">Back to fleet</a>
  {% endif %}
</div>
{% endblock %}
